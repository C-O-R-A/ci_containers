name: Build devcontainer images

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: find
        shell: bash
        run: |
          mapfile -t devcontainer_dirs < <(find . -type f -name "devcontainer.json" -printf '%h\n' | sort)

          if [ "${#devcontainer_dirs[@]}" -eq 0 ]; then
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          json=$(printf '%s\n' "${devcontainer_dirs[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "matrix=${json}" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        devcontainer_dir: ${{ fromJSON(needs.discover.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Install devcontainer CLI
        run: |
          npm install -g @devcontainers/cli

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build devcontainer image
        shell: bash
        run: |
          set -euo pipefail

          devcontainer_dir="${{ matrix.devcontainer_dir }}"
          workspace_folder="$(dirname "$devcontainer_dir")"
          image_name="$(basename "$devcontainer_dir")"
          if [ -z "$image_name" ] || [ "$image_name" = "." ]; then
            image_name="default"
          fi

          repo_owner="${GITHUB_REPOSITORY_OWNER,,}"
          image_repo="ghcr.io/${repo_owner}/ci_containers/${image_name}"

          if [[ "${{ github.ref_name }}" == "main" ]]; then
            image_tag="latest"
          else
            image_tag="${GITHUB_SHA}"
          fi

          echo "Building devcontainer from ${workspace_folder}"
          devcontainer build \
            --workspace-folder "$workspace_folder" \
            --image-name "${image_repo}:${image_tag}"

          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            docker push "${image_repo}:${image_tag}"
            docker tag "${image_repo}:${image_tag}" "${image_repo}:${GITHUB_SHA}"
            docker push "${image_repo}:${GITHUB_SHA}"
          fi
